worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  client_max_body_size 50M;

  server {
    listen 7860;
    server_name _;

    # OpenEnv + FastAPI (must be before the catch-all UI location)
    location = /api { proxy_pass http://127.0.0.1:8000/api; }
    location = /health { proxy_pass http://127.0.0.1:8000/health; }
    location = /state { proxy_pass http://127.0.0.1:8000/state; }
    location = /reset { proxy_pass http://127.0.0.1:8000/reset; }
    location = /step { proxy_pass http://127.0.0.1:8000/step; }
    location /docs { proxy_pass http://127.0.0.1:8000; }
    location /redoc { proxy_pass http://127.0.0.1:8000; }
    location = /openapi.json { proxy_pass http://127.0.0.1:8000/openapi.json; }

    # Streamlit UI (everything else, including / and WebSockets)
    location / {
      proxy_pass http://127.0.0.1:8501;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400;
      proxy_buffering off;
    }
  }
}
